<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 大頭照產生器 - 全功能版</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; 
            background-color: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; color: #333; 
        }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: flex; gap: 40px; max-width: 950px; align-items: flex-start; }
        
        /* 預覽區 */
        .preview-section { text-align: center; }
        .canvas-container {
            width: 320px; height: 320px; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%), linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%);
            background-size: 20px 20px; background-position: 0 0, 10px 10px; margin-bottom: 20px;
        }
        #avatarCanvas { width: 100%; height: 100%; }

        /* 控制區 */
        .controls { flex: 1; display: flex; flex-direction: column; gap: 18px; min-width: 380px; }
        .group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; font-weight: bold; color: #555; display: flex; justify-content: space-between; }
        .label-val { color: #06C755; }
        
        /* 顏色快選 */
        .color-presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 0 0 1px #ddd; transition: 0.2s; }
        .color-dot:hover { transform: scale(1.1); }
        .transparent-dot { background: #fff url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIElEQVQYV2Nk+M/AwMDEwMDBwMgAIXAFMNm7d69Cxl8An9oI999K60AAAAAASUVORK5CYII='); }

        textarea { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 15px; resize: none; }
        
        /* 輸入行排版 */
        .input-row { display: flex; gap: 15px; align-items: center; }
        .flex-1 { flex: 1; }
        input[type="text"] { padding: 8px; border-radius: 8px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; }
        input[type="color"] { border: none; width: 40px; height: 40px; cursor: pointer; background: none; padding: 0; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #06C755; }
        
        .download-btn { 
            background: #06C755; color: white; border: none; padding: 15px; border-radius: 10px; 
            font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .download-btn:hover { background: #05b04c; }
    </style>
</head>
<body>

<div class="container">
    <div class="preview-section">
        <div class="canvas-container">
            <canvas id="avatarCanvas" width="800" height="800"></canvas>
        </div>
        <p style="color: #999; font-size: 12px;">LINE 大頭照預覽</p>
    </div>

    <div class="controls">
        <div class="group">
            <label>底色快選</label>
            <div class="color-presets" id="presetList"></div>
            <div class="input-row">
                <input type="text" id="bgColorHex" value="#06C755" oninput="syncColor(this.value)" class="flex-1" placeholder="背景 HEX">
                <input type="color" id="bgColorPicker" value="#06C755" oninput="document.getElementById('bgColorHex').value=this.value; syncColor(this.value)">
            </div>
        </div>

        <div class="group">
            <label>文字內容 (支援換行)</label>
            <textarea id="textInput" rows="2" oninput="draw()">MILK</textarea>
        </div>

        <div class="group">
            <div class="input-row">
                <div class="flex-1">
                    <label>字體大小微調 <span class="label-val" id="fontSizeVal">100%</span></label>
                    <input type="range" id="sizeSlider" min="20" max="200" value="100" oninput="draw()">
                </div>
                <div style="text-align: center;">
                    <label>文字顏色</label>
                    <input type="color" id="textColorPicker" value="#FFFFFF" oninput="draw()">
                </div>
            </div>
        </div>

        <button class="download-btn" onclick="download()">下載圓形 PNG</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('avatarCanvas');
    const ctx = canvas.getContext('2d');
    const presets = ['#06C755', '#FF5B5B', '#FFA34D', '#FFD700', '#4D94FF', '#9B6BDE', '#FF85A2', '#2B2D42', '#F4F4F4', 'transparent'];

    function initPresets() {
        const container = document.getElementById('presetList');
        presets.forEach(color => {
            const dot = document.createElement('div');
            dot.className = 'color-dot' + (color === 'transparent' ? ' transparent-dot' : '');
            if(color !== 'transparent') dot.style.backgroundColor = color;
            dot.onclick = () => {
                document.getElementById('bgColorHex').value = color;
                document.getElementById('bgColorPicker').value = (color === 'transparent' ? '#ffffff' : color);
                window.isTransparent = (color === 'transparent');
                
                // 自動切換文字顏色（人性化小功能）
                if(color === '#F4F4F4' || color === 'transparent') {
                    document.getElementById('textColorPicker').value = '#333333';
                } else {
                    document.getElementById('textColorPicker').value = '#FFFFFF';
                }
                
                draw();
            };
            container.appendChild(dot);
        });
    }

    function draw() {
        const size = canvas.width;
        const centerX = size / 2;
        const centerY = size / 2;
        const bgHex = document.getElementById('bgColorHex').value;
        const textColor = document.getElementById('textColorPicker').value;
        const text = document.getElementById('textInput').value;
        const sliderScale = document.getElementById('sizeSlider').value / 100;
        
        document.getElementById('fontSizeVal').innerText = document.getElementById('sizeSlider').value + '%';

        ctx.clearRect(0, 0, size, size);

        // 裁切成圓形
        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, size / 2, 0, Math.PI * 2);
        ctx.clip();

        // 畫底色
        if (!window.isTransparent) {
            ctx.fillStyle = bgHex;
            ctx.fillRect(0, 0, size, size);
        }

        // 文字設定
        ctx.fillStyle = textColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // 自動縮放演算法
        const lines = text.split('\n');
        let fontSize = (size * 0.35) * sliderScale; 
        const maxLineWidth = size * 0.78; 

        let tries = 0;
        while (tries < 50) {
            ctx.font = `bold ${fontSize}px "Microsoft JhengHei", "微軟正黑體", sans-serif`;
            let longestWidth = 0;
            lines.forEach(line => {
                const width = ctx.measureText(line).width;
                if (width > longestWidth) longestWidth = width;
            });

            if (longestWidth > maxLineWidth || (fontSize * lines.length * 1.2) > size * 0.8) {
                fontSize -= 2;
                tries++;
            } else {
                break;
            }
        }

        const lineHeight = fontSize * 1.15;
        const startY = centerY - ((lines.length - 1) * lineHeight / 2);

        lines.forEach((line, index) => {
            ctx.fillText(line, centerX, startY + (index * lineHeight));
        });

        ctx.restore();
    }

    function syncColor(val) {
        window.isTransparent = (val === 'transparent');
        document.getElementById('bgColorPicker').value = (val.startsWith('#') ? val : '#ffffff');
        draw();
    }

    function download() {
        const link = document.createElement('a');
        link.download = 'avatar.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    initPresets();
    window.isTransparent = false;
    window.onload = draw;
</script>

</body>
</html>
